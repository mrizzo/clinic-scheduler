<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add-to-Calendar — QR / .ics / email generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>" />
<style>
  :root {
    --bg: #f4f6fb; --card: #ffffff; --line: #e2e8f0; --text: #1e293b;
    --muted: #64748b; --accent: #2563eb; --accent-ink: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin: 4px 0 20px; }
  header h1 { font-size: 21px; margin: 0; }
  header p { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
  .cols { display: grid; grid-template-columns: 1fr 260px; gap: 16px; align-items: start; }
  @media (max-width: 620px) { .cols { grid-template-columns: 1fr; } }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  input, select, textarea {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 54px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { color: var(--muted); opacity: .8; font-weight: 400; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 10px 14px; font-weight: 600; cursor: pointer; font-size: 14px; width: 100%;
  }
  button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .out { text-align: center; }
  .out img { width: 208px; height: 208px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .out .hint { font-size: 12px; color: var(--muted); margin: 8px 0 14px; }
  .out .stack { display: flex; flex-direction: column; gap: 8px; }
  .placeholder { color: var(--muted); font-size: 13px; padding: 40px 8px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 16px; }
  .when { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗓️ Add to Calendar</h1>
    <p>Type an event, get a QR code, calendar file, or email — anyone can scan or import it.</p>
  </header>

  <div class="cols">
    <div class="card">
      <div class="field">
        <label for="title">Title</label>
        <input id="title" value="Appointment" placeholder="What is it?" />
      </div>
      <div class="field grid2">
        <div><label for="date">Date</label><input id="date" type="date" /></div>
        <div><label for="time">Time</label><input id="time" type="time" value="09:30" /></div>
      </div>
      <div class="field grid2">
        <div>
          <label for="dur">Duration</label>
          <select id="dur">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60" selected>1 hour</option>
            <option value="90">1.5 hours</option>
            <option value="120">2 hours</option>
          </select>
        </div>
        <div><label for="loc">Location <span class="opt">— optional</span></label><input id="loc" placeholder="Address or place" /></div>
      </div>
      <div class="field">
        <label for="notes">Notes <span class="opt">— optional (phone, website…)</span></label>
        <textarea id="notes" placeholder="Anything to remember"></textarea>
      </div>
      <div class="when" id="when"></div>
    </div>

    <div class="card out">
      <div id="qrBox"><div class="placeholder">Pick a date &amp; time to generate a QR code</div></div>
      <div class="hint" id="qrHint"></div>
      <div class="stack">
        <button id="dl" disabled>⬇︎ Download .ics</button>
        <button class="ghost" id="mail" disabled>✉️ Email it</button>
        <button class="ghost" id="copy" disabled>🔗 Copy calendar link</button>
        <button class="ghost" id="maps" disabled>📍 Open location in Maps</button>
      </div>
    </div>
  </div>

  <footer>Runs entirely in your browser — nothing is uploaded. Scan the QR to add it to Google Calendar; use .ics for Apple Calendar / Outlook / anything.</footer>
</div>

<script type="module">
import QRCode from "https://esm.sh/qrcode@1.5.3";

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const enc = encodeURIComponent;
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone; // the user's own tz

// Read the form into a normalized event, or null if date/time missing.
function readEvent() {
  const title = $("title").value.trim() || "Appointment";
  const date = $("date").value;        // YYYY-MM-DD
  const time = $("time").value;        // HH:MM
  if (!date || !time) return null;
  const mins = parseInt($("dur").value, 10) || 60;
  const [Y, M, D] = date.split("-").map(Number);
  const [h, m] = time.split(":").map(Number);
  const start = new Date(Y, M - 1, D, h, m);
  const end = new Date(start.getTime() + mins * 60000);
  return { title, start, end, loc: $("loc").value.trim(), notes: $("notes").value.trim() };
}

const stampLocal = (d) =>
  `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

// Google Calendar "add event" URL — scannable, works cross-platform via browser.
function gcalUrl(ev) {
  const dates = `${stampLocal(ev.start)}/${stampLocal(ev.end)}`;
  let u = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    `&text=${enc(ev.title)}&dates=${dates}&ctz=${enc(TZ)}`;
  if (ev.loc) u += `&location=${enc(ev.loc)}`;
  if (ev.notes) u += `&details=${enc(ev.notes)}`;
  return u;
}

// A universal .ics (floating local time = same wall-clock in any calendar).
function buildICS(ev) {
  const dtstamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
  const esc = (s) => s.replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//add-to-calendar//EN", "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:${stampLocal(ev.start)}-${Math.random().toString(36).slice(2)}@add-to-calendar`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${stampLocal(ev.start)}`,
    `DTEND:${stampLocal(ev.end)}`,
    `SUMMARY:${esc(ev.title)}`,
    ...(ev.loc ? [`LOCATION:${esc(ev.loc)}`] : []),
    ...(ev.notes ? [`DESCRIPTION:${esc(ev.notes)}`] : []),
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(ev.title)}`, "TRIGGER:-P1D", "END:VALARM",
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${esc(ev.title)}`, "TRIGGER:-PT2H", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR",
  ];
  return lines.join("\r\n") + "\r\n";
}

const fmtWhen = (ev) => ev.start.toLocaleString(undefined, {
  weekday: "short", year: "numeric", month: "short", day: "numeric",
  hour: "2-digit", minute: "2-digit",
});

let current = null;

async function render() {
  const ev = readEvent();
  current = ev;
  const on = !!ev;
  ["dl", "mail", "copy"].forEach((id) => { $(id).disabled = !on; });
  $("maps").disabled = !(ev && ev.loc);
  $("when").textContent = ev ? `📅 ${fmtWhen(ev)} · ${ev.end && Math.round((ev.end - ev.start) / 60000)} min · ${TZ}` : "";
  if (!ev) {
    $("qrBox").innerHTML = `<div class="placeholder">Pick a date &amp; time to generate a QR code</div>`;
    $("qrHint").textContent = "";
    return;
  }
  const dataUrl = await QRCode.toDataURL(gcalUrl(ev), { margin: 1, width: 416 });
  $("qrBox").innerHTML = `<img src="${dataUrl}" alt="QR code to add ${ev.title} to your calendar" />`;
  $("qrHint").textContent = "Scan with your phone camera to add it";
}

function download(name, text) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "event";

$("dl").addEventListener("click", () => { if (current) download(`${slug(current.title)}.ics`, buildICS(current)); });
$("mail").addEventListener("click", () => {
  if (!current) return;
  const body = `${fmtWhen(current)}\n\nAdd to your calendar: ${gcalUrl(current)}` +
    (current.loc ? `\n\nWhere: ${current.loc}` : "") + (current.notes ? `\n\n${current.notes}` : "");
  location.href = `mailto:?subject=${enc(current.title)}&body=${enc(body)}`;
});
$("copy").addEventListener("click", async () => {
  if (!current) return;
  try { await navigator.clipboard.writeText(gcalUrl(current)); $("copy").textContent = "✓ Copied"; setTimeout(() => $("copy").textContent = "🔗 Copy calendar link", 1500); }
  catch { prompt("Copy this link:", gcalUrl(current)); }
});
$("maps").addEventListener("click", () => {
  if (!current || !current.loc) return;
  window.open(`https://www.google.com/maps/search/?api=1&query=${enc(current.loc)}`, "_blank", "noopener");
});

// Optional preset via ?cfg=<name>, looked up in configs.json. Fills the clinic
// fields (title, location, notes template incl. a "Doctor:" line) and leaves
// the date/time/doctor for the user. Unknown/missing configs are ignored.
async function loadConfig() {
  const key = new URLSearchParams(location.search).get("cfg");
  if (!key) return;
  try {
    const res = await fetch("configs.json", { cache: "no-store" });
    if (!res.ok) return;
    const cfg = (await res.json())[key];
    if (!cfg) return;
    if (cfg.title) $("title").value = cfg.title;
    if (cfg.location) $("loc").value = cfg.location;
    if (cfg.notesTemplate != null) $("notes").value = cfg.notesTemplate;
    if (cfg.durationMin) $("dur").value = String(cfg.durationMin);
  } catch { /* offline / file:// — just fall back to generic defaults */ }
}

// Live update on any change; default the date to today, then apply any preset.
["title", "date", "time", "dur", "loc", "notes"].forEach((id) =>
  $(id).addEventListener("input", render));
const t = new Date();
$("date").value = `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
await loadConfig();
render();
</script>
</body>
</html>
